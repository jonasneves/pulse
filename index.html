<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pulse</title>
  <!-- Makes this page's WebMCP tools reachable from Claude, Cursor and VS Code (github.com/jonasneves/mcp-relay); connects only when the visitor presses "Use in Claude". -->
  <script src="https://relay.neves.cloud/webmcp.js"></script>
  <meta name="description" content="Growth of trending GitHub repos, Hugging Face models and Spaces, tracked daily over 90 days.">
  <script>try{var t=localStorage.getItem('pulse-theme');if(t==='dark'||t==='light')document.documentElement.dataset.theme=t;}catch(e){}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css?v=6">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 28 14" aria-hidden="true"><path d="M1 9h6l2-6 3 10 3-8 2 4h10"/></svg>
    <span class="brand-name">pulse</span>
  </div>
  <nav class="tabs" aria-label="Source">
    <button class="tab" type="button" data-tab="all" aria-pressed="true">All</button>
    <button class="tab" type="button" data-tab="github" aria-pressed="false">GitHub</button>
    <button class="tab" type="button" data-tab="models" aria-pressed="false">Models</button>
    <button class="tab" type="button" data-tab="spaces" aria-pressed="false">Spaces</button>
    <span class="tab-indicator" aria-hidden="true"></span>
  </nav>
  <div class="masthead-end">
    <time id="updated" class="updated"></time>
    <div class="agent">
      <button id="agent-btn" class="agent-btn" type="button" aria-expanded="false" aria-controls="agent-panel">
        <span class="agent-dot" aria-hidden="true"></span><span class="agent-state">Agent tools</span>
      </button>
      <div id="agent-panel" class="agent-panel" hidden>
        <p class="agent-status"></p>
        <ul class="agent-tools"></ul>
      </div>
    </div>
    <button id="theme-toggle" class="icon-btn" type="button" aria-label="Switch light or dark theme">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21.75 15A9.72 9.72 0 0 1 18 15.75 9.75 9.75 0 0 1 8.25 6c0-1.33.27-2.6.75-3.75A9.75 9.75 0 1 0 21.75 15z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="toolbar">
    <p class="legend">
      <svg viewBox="0 0 36 8" aria-hidden="true"><path class="trace-listed" d="M1 6 L17 3"/><path class="trace-followed" d="M19 3 L35 1"/></svg>
      Traces share one 90-day date scale: solid while on the list, dotted after it left. Height is scaled per row.
    </p>
    <label id="hide-judged-wrap" class="toggle" hidden>
      <input type="checkbox" id="hide-judged">
      <span>Hide lists and courses</span>
      <span class="toggle-note">judged by Jev</span>
      <span id="hide-judged-count" class="toggle-count"></span>
    </label>
  </div>
  <section id="gains" class="gains" aria-label="Fastest growing"></section>
  <div id="rows"></div>
</main>

<script src="rules.js?v=6"></script>
<script src="trace.js?v=6"></script>
<script src="links.js?v=6"></script>
<script src="rows.js?v=6"></script>
<script src="overview.js?v=6"></script>
<script src="tools.js?v=6"></script>
<script src="index.js?v=6"></script>
</body>
</html>
