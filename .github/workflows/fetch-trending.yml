name: Fetch Trending Data

on:
  schedule:
    - cron: '17 5 * * *'   # daily; history keeps one observation per item per day
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch.js'

concurrency:
  group: fetch-trending
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch trending data
        run: node scripts/fetch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # follow-up star counts: 5000 req/h instead of 60
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}  # Jev kind judgments; skipped when unset

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: update trending data [skip ci]"
          git push
